const DATA=loadState();
let selected=DATA.selected||0, view="program", week=getDefaultWeek(), storageFailed=false;
function fresh(){return {selected:0,theme:"light",people:PEOPLE.map(()=>({checks:{},notes:{},records:[]}))}}
function loadState(){try{const raw=localStorage.getItem(KEY);if(!raw)return fresh();const d=JSON.parse(raw);if(!d||!Array.isArray(d.people)||d.people.length!==2)return fresh();return d}catch(e){storageFailed=true;return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DATA));storageFailed=false}catch(e){storageFailed=true}}
function safeRemove(){try{localStorage.removeItem(KEY)}catch(e){storageFailed=true}}
function person(){return DATA.people[selected]}
function getDefaultWeek(){const day=Math.floor((new Date().setHours(0,0,0,0)-START.getTime())/86400000);return Math.max(0,Math.min(31,Math.floor(day/7)))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function dateOf(w,d){return new Date(START.getFullYear(),START.getMonth(),START.getDate()+w*7+d)}
function dateKey(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function fmt(dt,opts){return new Intl.DateTimeFormat("tr-TR",opts||{day:"numeric",month:"short"}).format(dt)}
function quoteFor(dt){const serial=Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/86400000);return QUOTES[((serial%QUOTES.length)+QUOTES.length)%QUOTES.length]}
function quoteToday(){return quoteFor(new Date())}
function subjectFor(key){return {physics:"Fizik",chemistry:"Kimya",biology:"Biyoloji"}[key]||key}
function topic(key){return WEEKS[week][key]}
function focusFor(w,d){const m=MODES[d];return {math:WEEKS[w].math, mode:m}}
function dayTasks(w,d){
 const wk=WEEKS[w], mode=MODES[d], science=["physics","chemistry","biology"][d%3], second=["chemistry","biology","physics"][d%3];
 let tasks=[
  ["par","Paragraf rutini: "+(w<8?"15 soru, süreden çok doğru anlama":"20 soru, süre + yanlış analizi"),25],
  ["speed","Matematik hız çalışması: 10 temel işlem + 10 problem; takıldığını işaretle",35],
  ["math","TYT/AYT matematik — "+wk.math+" · "+mode,75],
  ["sci1",subjectFor(science)+" — "+wk[science]+" · konu + kolay soru",65],
  ["sci2",subjectFor(second)+" — "+wk[second]+" · aktif hatırlama + test",65],
  ["rot","Geometri / dil bilgisi / TYT sosyal: "+[wk.geo,wk.language,wk.social][d%3],45],
  ["review","Yanlış defteri + dünkü konulara 10 dakikalık kapalı kitap tekrar",50]
 ];
 const examPhase=w>=16;
 if(d===5 && examPhase){
   tasks=[
    ["par","Paragraf: 15–20 soru + kısa analiz",25],["speed","Temel işlem ve problem hız seti",25],
    ["math","Matematik eksik onarımı: "+wk.math,55],["sci1",subjectFor(science)+" konu/test: "+wk[science],55],
    ["sci2",subjectFor(second)+" tekrar/test: "+wk[second],50],["rot","Geometri veya sosyal kısa tarama",35],
    ["review","TYT denemesi yanlışlarını konuya göre sınıflandır",70],["mock","Tam TYT denemesi (165 dk) + başlangıç analizi",165]
   ];
 } else if(d===6 && w>=20 && w%2===0){
   tasks=[
    ["par","Paragraf: 10 soru, hafif tempo",15],["speed","Temel matematik 10 soru",20],
    ["math","AYT matematik seçilmiş eksik: "+wk.math,45],["sci1","Fizik-kimya-biyoloji kısa tekrar",55],
    ["sci2","Yanlış defteri: son iki denemeden seç",35],["rot","Geometri / sosyal kısa tekrar",30],
    ["review","AYT denemesi analizini tamamla; net değil konu hatası bul",100],["mock","Tam AYT denemesi (180 dk)",180]
   ];
 }else if(d>=5){
   let label=w<4?"Hafta özeti + temel kazanım testi":w<8?"Konu tarama testi + çözümlü analiz":w<16?"TYT/AYT branş denemesi veya 30 soruluk karma test":w<20?"Branş denemesi + ayrıntılı yanlış analizi":"Deneme sonrası eksik konu onarımı";
   tasks.push(["test",label+" (120 dk)",120]);
 }
 return tasks.map(a=>({id:a[0],name:a[1],mins:a[2]}))
}
function tasksForDate(w,d){return dayTasks(w,d)}
function dateTasksKey(w,d){return dateKey(dateOf(w,d))}
function getTaskTotal(w,d){return tasksForDate(w,d).length}
function progressCount(w,d){const k=dateTasksKey(w,d);return tasksForDate(w,d).filter(t=>person().checks[k+"_"+t.id]).length}
function progressMarkup(done,total,id){const p=total?Math.round(100*done/total):0;return '<div class="progressline"><i id="'+id+'" style="width:'+p+'%"></i></div><div class="progressmeta"><span>'+done+' / '+total+' görev</span><span>'+p+'%</span></div>'}
function updateProgress(){
 const w=week;let done=0,total=0;
 for(let d=0;d<7;d++){const dc=progressCount(w,d),tc=getTaskTotal(w,d);done+=dc;total+=tc;const p=Math.round(100*dc/tc);const fill=document.getElementById("dayfill-"+d);if(fill)fill.style.width=p+"%";const label=document.getElementById("daypct-"+d);if(label)label.textContent=p+"%";const ct=document.getElementById("daycount-"+d);if(ct)ct.textContent=dc+"/"+tc}
 const p=Math.round(100*done/total),fill=document.getElementById("weekfill");if(fill)fill.style.width=p+"%";const txt=document.getElementById("weekcount");if(txt)txt.textContent=done+" / "+total+" görev";
}

function renderProgram(){
 const wk=WEEKS[week], from=dateOf(week,0), to=dateOf(week,6);let done=0,total=0;
 for(let d=0;d<7;d++){done+=progressCount(week,d);total+=getTaskTotal(week,d)}
 let out='<section class="card quote"><div class="eyebrow">Bugünün notu</div>“'+esc(quoteToday())+'”</section>';
 out+='<section class="card"><div class="weeknav"><button class="arrow" data-week="-1" aria-label="Önceki hafta">‹</button><h2>Hafta '+(week+1)+' · '+esc(wk.title)+'</h2><button class="arrow" data-week="1" aria-label="Sonraki hafta">›</button></div><p class="muted small center">'+fmt(from,{day:"numeric",month:"long"})+' – '+fmt(to,{day:"numeric",month:"long",year:"numeric"})+' <span class="tag">'+esc(wk.phase)+'</span></p>'+progressMarkup(done,total,"weekfill").replace('>'+done+' / '+total+' görev<',' id="weekcount">'+done+' / '+total+' görev<')+'</section>';
 out+='<section class="notice">Her konu için “kesin çıkar” sözü verilemez. Bu rota, geçmiş sınavlarda sık karşılaşılan temel başlıklara öncelik verir. Video izlemek tek başına görev sayılmaz: aynı gün kolay-orta soru çöz, yanlışları ertesi gün yeniden dene.</section>';
 out+='<div class="programgrid">';
 for(let d=0;d<7;d++){
  const dt=dateOf(week,d), tasks=tasksForDate(week,d), key=dateKey(dt), dc=progressCount(week,d), pct=Math.round(100*dc/tasks.length);
  const isToday=dateKey(dt)===dateKey(new Date());const open=isToday||(!isToday&&d===0&&dateKey(new Date())<dateKey(START));
  out+='<details class="card day" '+(open?"open":"")+'><summary><span><span class="daytitle">'+DAYNAMES[d]+'</span> '+(isToday?'<span class="tag">Bugün</span>':'')+'<br><span class="daydate">'+fmt(dt,{day:"numeric",month:"long"})+' · '+(d<5?"6 saat":(d===5?"8 saat":"8 saat"))+'</span></span><span class="daypercent" id="daypct-'+d+'">'+pct+'%</span></summary><div class="daybody"><div class="daytheme">Haftanın odağı: '+esc(wk.math)+' · '+esc(wk[["physics","chemistry","biology"][d%3]])+'</div><div class="dayquote">“'+esc(quoteFor(dt))+'”</div><div class="progressline"><i id="dayfill-'+d+'" style="width:'+pct+'%"></i></div><div class="progressmeta"><span id="daycount-'+d+'">'+dc+'/'+tasks.length+'</span><span>günlük ilerleme</span></div><div class="tasklist" style="margin-top:10px">';
  tasks.forEach(t=>{const checked=!!person().checks[key+"_"+t.id];out+='<label class="task '+(checked?"done":"")+'"><input type="checkbox" class="task-check" data-key="'+key+"_"+t.id+'" '+(checked?"checked":"")+'><span class="taskname">'+esc(t.name)+'</span><span class="duration">'+t.mins+' dk</span></label>'});
  out+='</div><label class="field" style="margin-top:12px"><span class="small muted"><b>Bugün ne öğrendim, neyi anlamadım?</b></span><textarea class="note" data-note="'+key+'" placeholder="Bir cümleyle not al...">'+esc(person().notes[key]||"")+'</textarea></label></div></details>';
 }
 out+='</div><section class="card"><h3>Bu haftanın çalışma kuralı</h3><p class="muted small">Video hızını anlama düzeyinize göre seçin. Anlamadığınız yerde durdurup kendi örneğinizi çözün; konu başına önce temel test, sonra orta seviye. Her yanlışın yanına sebebini yazın: bilgi, işlem, dikkat veya süre.</p><div class="grid2"><div class="stat"><span class="muted small">Başlangıç hedefi</span><b>İlk 4 hafta</b><span class="small muted">Temel kur + aynı gün pratik</span></div><div class="stat"><span class="muted small">Denemeye geçiş</span><b>Kademeli</b><span class="small muted">Önce kısa test, sonra tam deneme</span></div></div></section>';
 document.getElementById("content").innerHTML=out;
}

function renderNets(){
 const records=person().records.slice().sort((a,b)=>b.date.localeCompare(a.date));
 const fields={TYT:[["Türkçe",40],["Matematik",40],["Fen",20],["Sosyal",20]],AYT:[["Matematik",40],["Fizik",14],["Kimya",13],["Biyoloji",13]]};
 let sums={TYT:{total:0,max:120,n:0},AYT:{total:0,max:80,n:0}};
 records.forEach(r=>{const f=fields[r.type];if(!f)return;const val=f.reduce((a,x)=>a+(Number(r.scores[x[0]])||0),0);sums[r.type].total+=val;sums[r.type].n++});
 let bars=["TYT","AYT"].map(type=>{const s=sums[type],avg=s.n?s.total/s.n:0,p=Math.max(0,Math.min(100,100*avg/s.max));return '<div class="barrow"><b>'+type+' ort.</b><div class="barbg"><div class="barfill" style="width:'+p+'%"></div></div><span>'+avg.toFixed(1)+'/'+s.max+'</span></div>'}).join("");
 let html='<section class="card"><div class="eyebrow">'+esc(PEOPLE[selected])+'</div><h2>Deneme netleri</h2><p class="muted small">Net hesabını deneme kitapçığındaki kurala göre gir. Ders bazlı netleri kaydet; sonuçları burada karşılaştır.</p><div class="bars">'+bars+'</div></section>';
 html+='<section class="card"><h3>Yeni deneme ekle</h3><form id="recordForm" class="recordform"><div class="field"><label for="rdate">Tarih</label><input id="rdate" name="date" type="date" required value="'+dateKey(new Date())+'"></div><div class="field"><label for="rtype">Sınav</label><select id="rtype" name="type"><option>TYT</option><option>AYT</option></select></div><div class="field wide" id="scoreFields"></div><div class="field wide"><button class="submit" type="submit">Denemeyi kaydet</button></div></form></section>';
 html+='<section class="card"><h3>Kayıt geçmişi</h3>';
 if(!records.length)html+='<p class="muted small">Henüz deneme eklenmedi. İlk denemeden sonra ders bazlı netlerin burada görünür.</p>';
 else{html+='<div class="records">';records.forEach(r=>{const f=fields[r.type],sum=f.reduce((a,x)=>a+(Number(r.scores[x[0]])||0),0);const details=f.map(x=>x[0]+': '+(Number(r.scores[x[0]])||0)).join(' · ');html+='<article class="record"><div class="recordtop"><b>'+fmt(new Date(r.date+"T00:00:00"),{day:"numeric",month:"short",year:"numeric"})+' · '+r.type+' · '+sum.toFixed(1)+' net</b><button class="delete" data-del="'+esc(r.id)+'" aria-label="Denemeyi sil">Sil</button></div><div class="recorddata">'+esc(details)+'</div></article>'});html+='</div>'}
 html+='</section>';
 document.getElementById("content").innerHTML=html;
 document.getElementById("rtype").addEventListener("change",renderScoreFields);renderScoreFields();
}

["TYT Sosyal","Sayısal puan türünde TYT sosyal de toplam nete katkı verir. Haftada 3 kısa oturumla Benim Hocam’ın temel konu serilerinden ilerleyin; ezber yerine kavram kartı ve kısa test kullanın.","https://www.youtube.com/results?search_query=Benim+Hocam+TYT+Sosyal+kamp%C4%B1"]
];
function renderResources(){
 let html='<section class="card"><div class="eyebrow">Başlangıç seviyesi</div><h2>Hangi derste hangi hocayı dinlemeli?</h2><p class="muted small">Bir derste tek ana kamp seçin. Video + not + aynı gün soru + ertesi gün kısa tekrar. Konuyu anlamadıysanız ikinci hocayı yalnızca o başlık için açın.</p>';
 SOURCES.forEach(s=>{const links=Array.isArray(s[2])?s[2]:[["YouTube’da kampı bul",s[2]]];html+='<div class="resource"><b>'+esc(s[0])+'</b><p>'+esc(s[1])+'</p>'+links.map(l=>'<a href="'+l[1]+'" target="_blank" rel="noopener">'+esc(l[0])+' ↗</a>').join(' · ')+'</div>'});html+='</section>';
 html+='<section class="card"><h3>Bu programın öncelik sırası</h3><p class="small muted">İlk 4 hafta aritmetik-cebir ve fen kavramlarını kurar. Sonra problemler, üçgen-geometri ve temel TYT fen konuları düzenli pratikle ilerler. AYT matematik ve fen temelleri eş zamanlı başlar; bahar döneminde AYT ağırlığı ve deneme analizi artar. Günlük paragraf ve matematik hız çalışması yıl boyunca sürer.</p><div class="notice">“Her yıl istisnasız çıkar” biçiminde güvenilir bir konu garantisi yoktur; ÖSYM soru kitapçıkları her yıl farklı dağılım gösterebilir. Bu seçki yüksek öncelikli, temel kuran başlıklardır. 150 bin hedefi için sonuç garantisi verilemez; deneme sonuçlarına göre rota ve yükü düzenli güncelleyin.</div></section>';
 html+='<section class="card"><h3>Planı hazırlarken kullanılan kaynaklar</h3><div class="resource"><b>2027 YKS tarihi</b><p>ÖSYM duyurusuna göre sınav 19–20 Haziran 2027’de yapılacak.</p><a href="https://www.osym.gov.tr/yks-19-20-haziran-2027de-yapilacak" target="_blank" rel="noopener">ÖSYM duyurusu ↗</a></div><div class="resource"><b>Geçmiş soru dağılımları</b><p>ÖSYM, gelecekteki sınavlar için konu bazlı garanti yayımlamaz. Öncelikler 2018–2026 kitapçıklarının geçmiş dağılımlarını inceleyen analizlere dayalıdır.</p><a href="https://ertansinansahin.com/yks-soru-dagilimi/" target="_blank" rel="noopener">2018–2026 konu dağılımı analizi ↗</a></div><div class="resource"><b>Çalışma ritmi</b><p>25 dakika odak + 5 dakika ara. Dört odak turundan sonra 20–30 dakika uzun mola verin. Çalışma planındaki dakika toplamları molaları içermez.</p></div></section>';
 document.getElementById("content").innerHTML=html;
}
function render(){
 renderHeader();renderNav();
 if(view==="program"){renderProgram()}else if(view==="netler"){renderNets()}else{renderResources()}
 if(storageFailed)toast("Cihaz kaydı çalışmıyor; uygulama bu sekmede kullanılmaya devam eder.");
}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display="none",2600)}
document.getElementById("students").addEventListener("click",e=>{const b=e.target.closest("[data-student]");if(!b)return;selected=Number(b.dataset.student);DATA.selected=selected;save();render()});
document.getElementById("viewnav").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;view=b.dataset.view;render()});
document.getElementById("content").addEventListener("click",e=>{
 const wb=e.target.closest("[data-week]");if(wb){week=Math.max(0,Math.min(31,week+Number(wb.dataset.week)));render();return}
 const go=e.target.closest("[data-view]");if(go){view=go.dataset.view;render();return}
 const del=e.target.closest("[data-del]");if(del){person().records=person().records.filter(r=>r.id!==del.dataset.del);save();render();toast("Deneme kaydı silindi.")}
});
document.getElementById("content").addEventListener("change",e=>{
 if(e.target.matches(".task-check")){person().checks[e.target.dataset.key]=e.target.checked;save();e.target.closest(".task").classList.toggle("done",e.target.checked);updateProgress()}
});
document.getElementById("content").addEventListener("input",e=>{if(e.target.matches("[data-note]")){person().notes[e.target.dataset.note]=e.target.value;save()}});
document.getElementById("content").addEventListener("submit",e=>{
 if(e.target.id!=="recordForm")return;e.preventDefault();const form=new FormData(e.target),type=form.get("type"), names=type==="TYT"?["Türkçe","Matematik","Fen","Sosyal"]:["Matematik","Fizik","Kimya","Biyoloji"],scores={};
 for(const n of names){const raw=form.get("score-"+n);const v=raw===""?0:Number(raw);if(!Number.isFinite(v)||v<0){toast("Netleri kontrol edin.");return}scores[n]=v}
 const limits=type==="TYT"?{Türkçe:40,Matematik:40,Fen:20,Sosyal:20}:{Matematik:40,Fizik:14,Kimya:13,Biyoloji:13};
 for(const n of names)if(scores[n]>limits[n]){toast(n+" neti üst sınırı aşamaz.");return}
 person().records.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:String(form.get("date")),type:type,scores:scores});save();render();toast("Deneme kaydedildi.")
});
document.getElementById("themeBtn").addEventListener("click",()=>{DATA.theme=DATA.theme==="dark"?"light":"dark";save();render()});
document.getElementById("resetBtn").addEventListener("click",()=>{if(!confirm("Abdurrahman ve Tuana için tüm işaretlemeler, notlar, netler ve tema tercihi silinsin mi?"))return;safeRemove();const f=fresh();DATA.selected=f.selected;DATA.theme=f.theme;DATA.people=f.people;selected=0;week=getDefaultWeek();view="program";save();render();toast("Tüm kayıtlar sıfırlandı.")});
document.getElementById("todayBtn").addEventListener("click",()=>{week=getDefaultWeek();view="program";render();document.querySelector(".day[open]")?.scrollIntoView({behavior:"smooth",block:"start"})});
document.getElementById("recordForm")?.addEventListener("submit",()=>{});
function startPomodoro(){
 const btn=document.createElement("button");btn.className="iconbtn";btn.id="pomoBtn";btn.textContent="🍅";btn.setAttribute("aria-label","Pomodoro zamanlayıcısını aç");document.querySelector(".head-actions").appendChild(btn);
 btn.addEventListener("click",()=>{
  let box=document.getElementById("pomoBox");if(box){box.style.display=box.style.display==="none"?"block":"none";return}
  box=document.createElement("div");box.id="pomoBox";box.className="card";box.style.cssText="position:fixed;z-index:9;top:145px;right:14px;width:min(320px,calc(100vw - 28px));text-align:center";
  box.innerHTML='<div class="eyebrow">Pomodoro</div><h2 id="pomoTime">25:00</h2><p class="muted small" id="pomoState">Çalışma zamanı</p><div style="display:flex;gap:8px"><button class="submit" id="pomoStart" style="flex:1">Başlat</button><button class="delete" id="pomoReset">Sıfırla</button></div><p class="muted small">25 dk odak · 5 dk mola</p>';document.body.appendChild(box);
  let secs=1500,interval=null,rest=false;
  const tick=()=>{secs--;document.getElementById("pomoTime").textContent=pad(Math.floor(secs/60))+":"+pad(secs%60);if(secs<=0){clearInterval(interval);interval=null;rest=!rest;secs=rest?300:1500;document.getElementById("pomoState").textContent=rest?"Mola zamanı — 5 dakika":"Yeni çalışma turu — 25 dakika";document.getElementById("pomoTime").textContent=rest?"05:00":"25:00";if("vibrate"in navigator)navigator.vibrate([150,80,150]);toast(rest?"Mola zamanı!":"Yeni odak turu hazır.")}};
  document.getElementById("pomoStart").onclick=()=>{if(interval){clearInterval(interval);interval=null;document.getElementById("pomoStart").textContent="Devam";}else{interval=setInterval(tick,1000);document.getElementById("pomoStart").textContent="Duraklat"}};
  document.getElementById("pomoReset").onclick=()=>{clearInterval(interval);interval=null;rest=false;secs=1500;document.getElementById("pomoTime").textContent="25:00";document.getElementById("pomoState").textContent="Çalışma zamanı";document.getElementById("pomoStart").textContent="Başlat"};
 })
}
render();startPomodoro();
</script>
</body>
</html>
